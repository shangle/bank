<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBank | Digital Finance</title>
    
    <!-- External UI Deps -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
    
    <!-- Mavo Core -->
    <link rel="stylesheet" href="https://get.mavo.io/mavo.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://get.mavo.io/mavo.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    borderRadius: { '2xl': '20px', '3xl': '24px', '4xl': '32px' },
                    colors: {
                        appleBlue: '#0061FF',
                        m3Surface: '#F8F9FC',
                        m3Tonal: '#E7F0FF',
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-m3Surface text-slate-900 font-sans antialiased min-h-screen">

    <div mv-app="vibebank" mv-storage="local" class="flex flex-col min-h-screen p-4 md:p-8">
        
        <!-- Header / Profile Section -->
        <header class="max-w-4xl mx-auto w-full flex justify-between items-center mb-10">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-appleBlue rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <span class="text-white font-black text-sm">VB</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">VibeBank</span>
            </div>
            
            <div class="w-10 h-10 bg-slate-200 rounded-full border-2 border-white shadow-sm overflow-hidden">
                <img src="https://ui-avatars.com/api/?name=Joe+Average&background=random" alt="User Profile">
            </div>
        </header>

        <!-- Main Dashboard Content -->
        <main class="max-w-4xl mx-auto w-full space-y-8">
            
            <!-- Hero Balance Card -->
            <section class="glass-card p-10 flex flex-col items-center text-center">
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2">Current Total Balance</span>
                <div class="balance-text text-6xl md:text-7xl text-slate-900 mb-8" property="balance">$4,250.32</div>
                
                <!-- Quick Actions (M3 Style) -->
                <div class="flex gap-4 w-full max-w-sm">
                    <button class="m3-tonal-btn flex-1 py-4 rounded-3xl flex flex-col items-center gap-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Send</span>
                    </button>
                    <button class="m3-tonal-btn flex-1 py-4 rounded-3xl flex flex-col items-center gap-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Pay</span>
                    </button>
                    <button class="m3-tonal-btn flex-1 py-4 rounded-3xl flex flex-col items-center gap-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Request</span>
                    </button>
                </div>
            </section>

            <!-- Accounts Section -->
            <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass-card p-6 flex justify-between items-center group cursor-pointer hover:border-appleBlue/20 transition-all">
                    <div>
                        <h3 class="text-sm font-bold text-slate-900">Main Checking</h3>
                        <span class="text-xs text-slate-400">Account • 4291</span>
                    </div>
                    <div class="text-lg font-bold text-slate-800">$2,450.00</div>
                </div>
                <div class="glass-card p-6 flex justify-between items-center group cursor-pointer hover:border-appleBlue/20 transition-all">
                    <div>
                        <h3 class="text-sm font-bold text-slate-900">Savings</h3>
                        <span class="text-xs text-slate-400">Account • 8820</span>
                    </div>
                    <div class="text-lg font-bold text-slate-800">$1,800.32</div>
                </div>
            </section>

            <!-- Recent Activity Ledger -->
            <section class="space-y-4">
                <div class="flex justify-between items-center px-4">
                    <h2 class="text-lg font-bold text-slate-900">Recent Activity</h2>
                    <button class="text-[10px] font-black uppercase text-appleBlue hover:underline tracking-widest">View All</button>
                </div>

                <div class="glass-card overflow-hidden divide-y divide-slate-50">
                    <div mv-multiple="transactions" class="transaction-item px-6 py-5 flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-lg">
                                <span property="categoryEmoji" mv-default="🛒">🛒</span>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900" property="description">Amazon Marketplace</h4>
                                <span class="text-xs text-slate-400" property="date">Yesterday</span>
                            </div>
                        </div>
                        <div class="text-sm font-black text-slate-900">
                            <span property="type" hidden mv-default="expense">expense</span>
                            <span property="amount" mv-default="- $45.00">- $45.00</span>
                        </div>
                    </div>
                    
                    <!-- Placeholder POC Rows -->
                    <div class="transaction-item px-6 py-5 flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-lg">
                                🍕
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900">Dominos Pizza</h4>
                                <span class="text-xs text-slate-400">Mar 27</span>
                            </div>
                        </div>
                        <div class="text-sm font-black text-slate-900">- $24.50</div>
                    </div>
                    
                    <div class="transaction-item px-6 py-5 flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-slate-50 rounded-2xl flex items-center justify-center text-lg">
                                💰
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900">Salary Payout</h4>
                                <span class="text-xs text-slate-400">Mar 25</span>
                            </div>
                        </div>
                        <div class="text-sm font-black text-appleBlue">+ $3,250.00</div>
                    </div>
                </div>
            </section>

        </main>
        
        <footer class="mt-auto py-10 text-center opacity-30 text-[10px] font-bold uppercase tracking-[0.2em]">
            VibeBank Proof of Concept • v1.0
        </footer>
    </div>

    <!-- Minimal Helper Logic -->
    <script>
        // No heavy engine needed for this POC
    </script>
</body>
</html>
